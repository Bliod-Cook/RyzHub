[package]
name = "ryzhub-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ryzhub-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
vte = "0.15"
ruzstd = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
prost.workspace = true
syntect = { version = "5.3", default-features = false, features = ["dump-create"] }
