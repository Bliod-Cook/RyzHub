name: ryzhub
description: "RyzHub Chat / Work client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # The font of the CupertinoIcons that Flutter's own widgets reference.
  cupertino_icons: ^1.0.8
  flutter_rust_bridge: 2.11.1
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  sqflite: ^2.4.4
  sqflite_common_ffi: ^2.4.3
  path_provider: ^2.1.6
  idb_shim: ^2.9.9
  connectivity_plus: ^7.3.1
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.3
  web: ^1.1.1
  stream_channel: ^2.1.4
  file_picker: ^13.1.0
  desktop_drop: ^0.8.0
  cross_file: ^0.3.5+5
  pdfrx: ^2.6.5
  flutter_math_fork: ^0.7.4
  crypto: ^3.0.7
  xterm: ^4.0.0
  webview_flutter: ^4.14.1
  webview_windows: ^0.4.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: RyzHub Sans
      fonts:
        - asset: assets/fonts/RyzHubSans.ttf
    - family: 0xProto
      fonts:
        - asset: assets/fonts/0xProto-Regular-NL.ttf
