listen = "127.0.0.1:8080"
allowed_origins = ["http://localhost:3000", "http://127.0.0.1:3000"]
events_retention_days = 30

[policy]
max_sandboxes = 2
allow_memory = false

# The local Anthropic protocol fixture scripts/dev.sh starts.
[llm]
enabled = true
upstream_url = "http://127.0.0.1:9081"
model = "fixture-model"
