[package]
name = "ryzhub-server"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
async-nats.workspace = true
axum.workspace = true
chrono.workspace = true
futures-util.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
ryzhub-proto.workspace = true
ryzhub-domain.workspace = true
argon2 = "0.5"
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
toml = "0.9"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
aes-gcm = "0.10"
tokio-stream = "0.1"
ryzhub-execution = { path = "../execution" }
bytes = "1"
object_store = { version = "0.14", default-features = false, features = ["aws"] }
tokio-util = { version = "0.7", features = ["io"] }
zstd = "0.13"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
tar = "0.4"
ed25519-dalek = "2"
nix = { version = "0.30", features = ["resource"] }
pdf-extract = "0.12"
quick-xml = "0.41"
# Local embeddings (`local-embedding`): Qwen3-Embedding on candle, no ONNX Runtime linked.
fastembed = { version = "7.1", default-features = false, features = ["qwen3", "hf-hub-rustls-tls", "ort-load-dynamic"], optional = true }
candle-core = { version = "0.11", optional = true }
tempfile = "3"
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }

[dev-dependencies]
ryzhub-core.workspace = true
tokio-tungstenite.workspace = true
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[features]
local-embedding = ["dep:fastembed", "dep:candle-core"]
