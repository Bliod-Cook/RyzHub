name: ryzhub
services:
  postgres:
    build: ./deploy/postgres
    image: ryzhub-postgres:18-search
    environment:
      POSTGRES_DB: ryzhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-development-only
      RYZHUB_APP_PASSWORD: local-app-only
      RYZHUB_WORKER_PASSWORD: local-worker-only
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ryzhub"]
      interval: 2s
      timeout: 2s
      retries: 20
  nats:
    image: nats:2.11-alpine
    ports: ["127.0.0.1:54222:4222"]
  # S3 for the Work suite (scripts/test-work.sh); its bucket is a directory made at start.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    profiles: [test]
    entrypoint: ["sh", "-c", "mkdir -p /data/ryzhub-test && exec minio server /data"]
    environment:
      MINIO_ROOT_USER: local-s3-access
      MINIO_ROOT_PASSWORD: local-s3-secret-key
    ports: ["127.0.0.1:59000:9000"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  postgres:

