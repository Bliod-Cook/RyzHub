syntax = "proto3";
package agentplatform.v1;

// Text offsets count UTF-8 bytes, never Dart UTF-16 units or Unicode characters.
message Frame {
  uint32 minor_version = 1;
  string channel = 2;
  int64 ts_ms = 3;
  // Internal fanout fencing metadata; gateways reject delayed retired publishers.
  uint64 writer_epoch = 4;
  oneof body {
    Hello hello = 10;
    Welcome welcome = 11;
    Ping ping = 12;
    Pong pong = 13;
    AuthRefresh auth_refresh = 14;
    AuthExpiring auth_expiring = 15;
    Subscribe subscribe = 20;
    Unsubscribe unsubscribe = 21;
    Snapshot snapshot = 22;
    SubscriptionSynced subscription_synced = 23;
    SubscriptionRevoked subscription_revoked = 24;
    ChannelLagged channel_lagged = 25;
    CommandEnvelope command = 30;
    CommandAck command_ack = 31;
    CommandRejected command_rejected = 32;
    EventEnvelope event = 40;
    Delta delta = 41;
    ItemFold item_fold = 42;
    ProtocolError protocol_error = 50;
  }
}
message Hello {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string device_id = 3;
  repeated string capabilities = 4;
  // The server keeps no subscriptions across connections; clients resubscribe by cursor.
  string resume_token = 5 [deprecated = true];
}
message Welcome {
  string connection_id = 1;
  // Always empty; see Hello.resume_token.
  string resume_token = 2 [deprecated = true];
  uint32 heartbeat_ms = 3;
  uint32 max_frame_bytes = 4;
  // Always false.
  bool resumed = 5 [deprecated = true];
}
message Ping { uint64 nonce = 1; }
message Pong { uint64 nonce = 1; }
message AuthRefresh { string token = 1; }
message AuthExpiring { int64 expires_at_ms = 1; }
message Subscribe { optional uint64 since_seq = 1; }
message Unsubscribe {}
message Snapshot {
  uint64 head_seq = 1;
  repeated Item items = 2;
  repeated PendingAction pending_actions = 3;
  repeated RunState runs = 4;
  repeated ReadState read_states = 5;
  // The user's drafts, in their user channel (minor version 6).
  repeated Draft drafts = 6;
}
message SubscriptionSynced { uint64 head_seq = 1; }
message SubscriptionRevoked { string reason = 1; }
message ChannelLagged { string reason = 1; }
message CommandEnvelope {
  string cid = 1;
  oneof command {
    SendMessage send_message = 10;
    DecideApproval decide_approval = 11;
    Cancel cancel = 12;
    MarkRead mark_read = 13;
    Steer steer = 14;
    SideQuery side_query = 15;
    AnswerQuestion answer_question = 16;
    UpdateRunConfig update_run_config = 17;
    Compact compact = 18;
    Fork fork = 19;
    CreateRun create_run = 20;
    UndoMemoryUpdate undo_memory_update = 21;
    InvokeMenuCommand invoke_menu_command = 22;
  }
}
// Runs a plugin's command (minor version 8): the server fills its prompt template with the
// parameters and sends the result as the member's message, starting a run as SendMessage does.
message InvokeMenuCommand {
  string installation_id = 1;
  string command = 2;
  // The parameters, as a JSON object.
  string params_json = 3;
  repeated string attachment_ids = 4;
}
// Creates a conversation and queues its first message as one command, which a client may queue
// offline (minor version 6). Sent on the creator's user channel; `conversation_id` is a UUID
// the client chose. A retry with the same cid returns the first result; an id another
// conversation has is refused with CONVERSATION_ID_TAKEN. The conversation and its queued
// message are created together; the run starts as for SendMessage.
message CreateRun {
  string conversation_id = 1;
  // chat or work; empty: the project's default mode, else chat.
  string mode = 2;
  // Run settings as for UpdateRunConfig.
  string run_config_json = 3;
  string project_id = 4;
  bool temporary = 5;
  // Empty: taken from the message.
  string title = 6;
  SendMessage first_message = 7;
}
// Undoes the memory change a memory notice reported (minor version 6). Sent on the user
// channel; a retry with the same cid undoes it once.
message UndoMemoryUpdate { string event_id = 1; }
message UpdateRunConfig { string config_json = 1; }
message Compact {}
message Fork { string item_id = 1; }
// config_json optionally carries settings chosen since the last UpdateRunConfig
// was confirmed; they apply before this message's run, in the same transaction.
// attachment_ids name files of the sender's library (minor version 3); text may then be empty.
message SendMessage {
  string text = 1;
  string config_json = 2;
  repeated string attachment_ids = 3;
}
message DecideApproval {
  string action_id = 1;
  uint64 run_epoch = 2;
  string decision = 3;
}
message Cancel {}
message MarkRead { uint64 read_seq = 1; }
message Steer {
  string text = 1;
  repeated string attachment_ids = 2;
}
message SideQuery { string text = 1; }
message AnswerQuestion { string action_id = 1; uint64 run_epoch = 2; string answer = 3; }
message CommandAck {
  string cid = 1;
  uint64 accepted_seq = 2;
  string result = 3;
}
message CommandRejected {
  string cid = 1;
  string code = 2;
  bool retryable = 3;
}
message Item {
  string id = 1;
  uint64 revision = 2;
  string kind = 3;
  string state = 4;
  // Display text. Always present; clients that do not understand `detail` render it as is.
  string text = 5;
  uint64 first_seq = 6;
  uint64 last_seq = 7;
  string run_id = 8;
  // `text` was cut at the server's per-item size limit; the full content is not replayed.
  bool truncated = 9;
  // Structured content for tool and file-change items (minor version 1), the sources an
  // assistant reply cites (minor version 2), the files a message carries (minor version 3)
  // and whether a conversation is pinned (minor version 5).
  ItemDetail detail = 10;
  // The item this one belongs to: a subagent call for what its agent did (minor version 7).
  string parent_item_id = 11;
}
message ItemDetail {
  oneof kind {
    ToolDetail tool = 1;
    FileChangeDetail file_change = 2;
    AnswerDetail answer = 3;
    AttachmentsDetail attachments = 4;
    ConversationDetail conversation = 5;
  }
}
// A conversation in its creator's user channel (minor version 5).
message ConversationDetail {
  // When it was pinned, in Unix milliseconds; 0 while it is not pinned.
  uint64 pinned_at_ms = 1;
  // The conversation channel's sequence when its last run ended: unread while greater than
  // the user's read position (minor version 6).
  uint64 activity_seq = 2;
}
// Files a user message or steer carries, in order.
message AttachmentsDetail { repeated Attachment files = 1; }
message Attachment {
  // The library entry; fetch its content or preview with this id.
  string id = 1;
  // Its name under /attachments in this conversation's sandboxes.
  string path = 2;
  string name = 3;
  string media_type = 4;
  uint64 size = 5;
  // image, pdf, text or file.
  string kind = 6;
  uint32 width = 7;
  uint32 height = 8;
}
// Sources from the provider's built-in web search, in order of first citation.
message AnswerDetail {
  repeated Citation citations = 1;
  // Sandbox files the reply links to, published to the member's library when it completed
  // (minor version 4).
  repeated SharedFile files = 2;
}
// A file a reply links to as `sandbox:/workspace/...` or `/attachments/...`.
message SharedFile {
  // The linked path, normalized: `/workspace/<path>` or `/attachments/<name>`.
  string link = 1;
  // The library entry it became; absent when it could not be published.
  Attachment file = 2;
  // Why not, e.g. FILE_NOT_FOUND, NOT_A_FILE, FILE_TOO_LARGE, ATTACHMENT_QUOTA_EXCEEDED.
  string error = 3;
}
message Citation {
  string url = 1;
  string title = 2;
  // The cited passage, when the provider returns one.
  string cited_text = 3;
}
message ToolDetail {
  string name = 1;
  string arguments_json = 2;
  // Present once the call has completed.
  string result_json = 3;
  // Human-readable command output, possibly truncated.
  string output = 4;
  // A plugin tool's MCP App page (`ui://…`), which shows its result (minor version 8).
  string app = 5;
  // The plugin, for a plugin tool.
  string plugin = 6;
}
message FileChangeDetail { repeated FileChange changes = 1; }
message FileChange {
  string path = 1;
  // add, update or delete.
  string change = 2;
  string diff = 3;
}
message PendingAction {
  string id = 1;
  string run_id = 2;
  uint64 run_epoch = 3;
  string summary = 4;
  repeated string options = 5;
  string status = 6;
  string resolved_device = 7;
  int64 expires_at_ms = 8;
  // approval or question. Replaces the `options == ["__answer__"]` convention (minor version 1).
  string kind = 9;
  // A question a plugin asks (MCP elicitation, minor version 8): `{"mode":"form","message",
  // "requestedSchema"}` for a form whose answer is a JSON object of its fields, or
  // `{"mode":"url","message","url"}` for a page the member opens, answered "accept" or
  // "decline". AnswerQuestion carries the answer as JSON text.
  string form_json = 10;
}
message EventEnvelope {
  uint64 seq = 1;
  string cause_cid = 2;
  oneof event {
    Item item_upserted = 10;
    PendingAction pending_action_changed = 11;
    RunState run_state_changed = 12;
    ReadState read_state_changed = 13;
    Draft draft_changed = 14;
  }
}
// A conversation's unsent message, synced across the user's devices (minor version 6). The
// latest write wins; an empty draft is a cleared one.
message Draft {
  string conversation_id = 1;
  string text = 2;
  repeated string attachment_ids = 3;
  int64 updated_at_ms = 4;
  string device_id = 5;
}
message RunState {
  string run_id = 1;
  string state = 2;
  uint64 exec_epoch = 3;
  bool read_only = 4;
  // Unix milliseconds; `ended_at_ms` is 0 while the run is active (minor version 2).
  int64 started_at_ms = 5;
  int64 ended_at_ms = 6;
}
message ReadState { string user_id = 1; uint64 read_seq = 2; string conversation_id = 3; }
message Delta {
  string item_id = 1;
  string stream = 2;
  uint32 part_index = 3;
  uint64 offset = 4;
  string text = 5;
  uint64 base_seq = 6;
  uint64 revision = 7;
}
message ItemFold {
  string item_id = 1;
  string stream = 2;
  uint32 part_index = 3;
  string text = 4;
  uint64 base_seq = 5;
  uint64 revision = 6;
}
message ProtocolError { string code = 1; string message = 2; }
// Internal Owner-to-Gateway fold response, not a WebSocket body.
message FrameBatch { repeated Frame frames = 1; }
